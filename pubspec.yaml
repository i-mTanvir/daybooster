name: daybooster
description: "DayBooster — The Architect Protocol. Daily habit tracker with RPG progression system."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_animate: ^4.5.0
  percent_indicator: ^4.2.3
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  confetti: ^0.8.0
  supabase_flutter: ^2.12.4
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - my_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
  image_path: "assets/icons/app_icon_source.png"
  image_path_android: "assets/icons/app_icon_source.png"
  image_path_ios: "assets/icons/app_icon_source.png"
  adaptive_icon_background: "#0D0D11"
  adaptive_icon_foreground: "assets/icons/app_icon_source.png"
  remove_alpha_ios: true
